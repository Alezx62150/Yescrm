<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Visioconférence · YES Immobilier</title>
<style>
:root{--ac:#a4573f;--bg:#f8f3ef;--tx:#2b2220;--mu:#7b6a64;--bd:#e5d8d1}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;display:flex;flex-direction:column}
header{background:#fff;border-bottom:1px solid var(--bd);padding:10px 16px;display:flex;align-items:center;gap:12px}
header img{height:36px}header b{color:var(--ac)}.m{color:var(--mu);font-size:14px}
main{flex:1;display:flex;flex-direction:column;min-height:0}
#info{padding:10px 16px;font-size:14px;color:var(--mu);background:#fffaf6;border-bottom:1px solid var(--bd)}
iframe{flex:1;border:0;width:100%;min-height:0;background:#000}
#stage{flex:1;display:flex;min-height:0}#vid{flex:1;min-width:0;display:flex;min-height:0}#vid iframe{flex:1}#doc{display:none;width:50%;border-left:1px solid var(--bd)}
@media(max-width:800px){#stage{flex-direction:column}#doc{width:100%;height:55%;border-left:0;border-top:1px solid var(--bd)}}
.err{max-width:520px;margin:40px auto;padding:20px;background:#fff;border:1px solid var(--bd);border-radius:14px}
a.btn{display:inline-block;background:var(--ac);color:#fff;border-radius:10px;padding:10px 16px;text-decoration:none;font-weight:600}
</style></head><body>
<header><img src="yes-logo.png" alt="YES Immobilier"><div><b>Visioconférence</b><div class="m">YES Immobilier</div></div></header>
<main id="m"></main>
<script>
const SBU='https://lkbjenepslizldroamsi.supabase.co',SBK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxrYmplbmVwc2xpemxkcm9hbXNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0OTQyNjEsImV4cCI6MjEwODA3MDI2MX0.qDdYmgJ-N5yFU-K1RT_VtHUOY0-EAQUx-_9L-v3UnQ0';
const q=new URLSearchParams(location.search),d=q.get('d')||'',r=q.get('r')||'',needCode=(q.get('c')||'').charAt(0)==='1';
const m=document.getElementById('m');
const SU=SBU+'/storage/v1/object/public/espaces/';
const loadJs=src=>new Promise((ok,ko)=>{const x=document.createElement('script');x.src=src;x.onload=ok;x.onerror=()=>ko(new Error(src));document.head.appendChild(x)});
const frame=async(u,t)=>{
  const src=u+(t?'?t='+encodeURIComponent(t):'');
  m.innerHTML='<div id="info">Autorisez la caméra et le micro quand votre navigateur le demande. Si la vidéo ne s’affiche pas, <a href="'+src+'" target="_blank" rel="noopener">ouvrez la visio dans un nouvel onglet</a>.</div><div id="stage"><div id="vid"></div><div id="doc"></div></div>';
  const vid=document.getElementById('vid'),dc=document.getElementById('doc');let vw=null,fr=null;
  try{
    if(!window.DailyIframe){try{await loadJs('https://unpkg.com/@daily-co/daily-js@0.67.0')}catch(e){await loadJs('https://unpkg.com/@daily-co/daily-js')}}
    await loadJs('visdoc.js');
    fr=window.DailyIframe.createFrame(vid,{iframeStyle:{width:'100%',height:'100%',border:'0'},showLeaveButton:true,lang:'fr'});
    fr.on('app-message',async ev=>{const d=ev&&ev.data;if(!d||d.ys!==1)return;
      try{
        if(d.t==='doc'&&typeof d.url==='string'&&d.url.indexOf(SU)===0){dc.style.display='flex';vw=window.YSDoc(dc,{ctl:false});await vw.load(d.url,String(d.name||'Document').slice(0,120),d.v)}
        else if(d.t==='view'&&vw)vw.apply(d.v);
        else if(d.t==='wide'){dc.style.width=(d.w&&window.innerWidth>800)?'72%':'';setTimeout(()=>window.dispatchEvent(new Event('resize')),50)}
        else if(d.t==='stop'&&vw){vw.stop();vw=null;dc.style.display='none'}
      }catch(e){}});
    await fr.join(t?{url:u,token:t}:{url:u});
    fr.sendAppMessage({ys:1,t:'hello'},'*')
  }catch(e){
    vid.innerHTML='<iframe allow="camera; microphone; fullscreen; display-capture; autoplay" src="'+src+'"></iframe>'}
};
if(!/^[a-z0-9-]{2,60}$/i.test(d)||!/^[\w-]{2,80}$/.test(r)){
  m.innerHTML='<div class="err"><h2 style="margin-top:0">Lien incomplet</h2><p>Ce lien de visioconférence n’est pas valide. Demandez-en un nouveau à votre conseiller YES Immobilier.</p></div>';
}else{
  const u='https://'+d+'.daily.co/'+r;
  if(!needCode)frame(u,'');
  else{
    m.innerHTML='<div class="err"><h2 style="margin-top:0">Code d’accès</h2><p>Saisissez le code à 6 chiffres reçu de votre conseiller YES Immobilier.</p><input id="cd" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" style="font-size:28px;letter-spacing:8px;text-align:center;width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px"><p id="er" style="color:#b3261e;min-height:22px;margin:8px 0"></p><a class="btn" href="#" id="go">Rejoindre la visio</a></div>';
    const go=async ev=>{if(ev)ev.preventDefault();const c=document.getElementById('cd').value.replace(/\D/g,''),er=document.getElementById('er');if(c.length!==6){er.textContent='Le code comporte 6 chiffres.';return}
      er.textContent='Vérification…';
      try{const x=await fetch(SBU+'/functions/v1/visio-join',{method:'POST',headers:{'Content-Type':'application/json',apikey:SBK},body:JSON.stringify({room:r,code:c})});const j=await x.json().catch(()=>({}));
        if(!x.ok||!j.token){er.textContent=j.error||'Accès refusé ('+x.status+')';return}
        frame(u,j.token)}catch(e){er.textContent='Connexion impossible, réessayez.'}};
    document.getElementById('go').addEventListener('click',go);document.getElementById('cd').addEventListener('keydown',e=>{if(e.key==='Enter')go(e)});
  }
}
</script></body></html>
