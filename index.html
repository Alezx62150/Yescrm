{n:'Lettre de convocation du vendeur',cat:'p',grp:'Convocation',code:'CJV',h:'<p>{{date}}</p><p>À l’attention de {{vendeur}}</p><h2>Objet : convocation pour la signature de l’acte de vente</h2><p>Madame, Monsieur,</p><p>Nous vous convoquons en l’étude afin de signer l’acte de vente du bien situé {{bien}}, au profit de {{acquereur}}, pour un prix de {{prix}}.</p><p>Merci de vous munir d’une pièce d’identité en cours de validité.</p><p>Veuillez agréer, Madame, Monsieur, l’expression de nos salutations distinguées.</p>'},

const pcRate=(l,p)=>+String(l.v!==undefined&&l.v!==''?l.v:(p.tva==null?'10':p.tva)).replace(',','.')||0;
const pcTot=p=>{let ht=0,tv=0;(p.lignes||[]).forEach(l=>{const m=+num(l.m)||0;ht+=m;tv+=m*pcRate(l,p)/100});return {ht,tva:tv,ttc:ht+tv}};
const pcParse=t=>{t=String(t||'').replace(/[  ]/g,' ').replace(/\s+/g,' ');
 const N='(\\d[\\d ]*(?:[.,]\\d+)?)',n=s=>s==null?null:parseFloat(String(s).replace(/ /g,'').replace(',','.')),g=(re,i)=>{const m=t.match(re);return m?m[i||1]:null};
 const o={};
 o.ref=g(/R[ée]f[ée]rence\s*:\s*([A-Z0-9]{5,})/i);o.date=g(/(\d{2}\/\d{2}\/\d{4})/);
 o.clef=n(g(new RegExp('TOTAL CLEF EN MAIN\\s*:?\\s*'+N+'\\s*€','i')));
 o.fai=n(g(new RegExp('TARIF FAI\\s*'+N+'\\s*€','i')));
 o.acte=n(g(new RegExp('TARIF ACTE EN MAIN\\s*'+N+'\\s*€','i')));
 
 o.surface=n(g(/SURFACE\s*(\d+(?:[.,]\d+)?)\s*m²/i));
 o.loyerM=n(g(new RegExp('LOYERS? MENSUELS?\\s*'+N+'\\s*€','i')));
 o.loyerA=n(g(new RegExp('LOYERS? ANNUELS?\\s*'+N+'\\s*€','i')));
 const tp=t.match(new RegExp('TAXE FONCI[ÈE]RE \\| PNO \\(ANNUEL\\)\\s*'+N+'\\s*€\\s*\\|\\s*'+N+'\\s*€','i'));if(tp){o.tf=n(tp[1]);o.pno=n(tp[2])}
 o.renta=n(g(/RENTABILIT[ÉE] BRUTE\s*:?\s*(\d+(?:[.,]\d+)?)\s*%/i));
 o.travTTC=n(g(new RegExp('TOTAL TRAVAUX\\s*'+N+'\\s*€\\s*TTC','i')));
 const ls=t.search(/D[ÉE]TAILS? LOYERS/i),le=t.search(/SIMULATEUR D.EMPRUNT/i);
 if(o.acte&&o.fai)o.notaire=o.acte-o.fai;o.lots=[];if(ls>=0){const s=t.slice(ls,le>ls?le:ls+1500).replace(/\(\s*(?:\d+\s*)?(?:T\d|Locals?)[^)]*\)\s*(?=\S)/g,x=>x);
  const nm=[...s.matchAll(/([A-Za-zÀ-ÿ][A-Za-zÀ-ÿ0-9]*(?: [A-Za-zÀ-ÿ0-9]+)*?)\s*\((\d+(?:[.,]\d+)?)\s*m²\)/g)].filter(m=>!/LOYERS|DÉTAILS|DETAILS/i.test(m[1]));
  const lo=[...s.matchAll(new RegExp('\\((?:LLD|LCD|LMD|[A-Z]{2,4})\\)\\s*:?\\s*'+N+'\\s*€','g'))].map(m=>n(m[1]));
  const seen={};nm.filter(m=>{const k=m[1]+m[2];if(seen[k])return false;seen[k]=1;return true}).forEach((m,i)=>o.lots.push({n:m[1].replace(/^.*?(T\d|Locals?|Studio|Garage|Cave)/,'$1').trim(),s:n(m[2]),l:lo[i]==null?null:lo[i]}))}
 o.postes=[];const ds=t.search(/D[ÉE]TAIL DES TRAVAUX/i),de=t.search(/TOTAL TRAVAUX/i);
 if(ds>=0){const s=t.slice(ds+17,de>ds?de:undefined).replace(/\(~[^)]*\)/g,' ');
  const nm=[...s.matchAll(/([A-Za-zÀ-ÿ&' ]+?)\s*\(TVA\s*(\d+(?:[.,]\d+)?)\s*%\)/g)].map(m=>({p:m[1].trim().replace(/^[A-Z]\s+(?=[A-ZÀ-Ÿ])/,''),v:m[2].replace('.',',')}));
  const am=[...s.matchAll(new RegExp(N+'\\s*€\\s*TTC\\s*\\(\\s*'+N+'\\s*€\\s*\\)','g'))].map(m=>[n(m[1]),n(m[2])]);
  if(nm.length&&nm.length===am.length)nm.forEach((x,i)=>o.postes.push({p:x.p,v:x.v,ttc:am[i][0],tva:am[i][1]}))}
 if(o.postes.length&&o.travTTC)o.postesOk=Math.abs(o.postes.reduce((a,x)=>a+x.ttc,0)-o.travTTC)<1;
 return o};

async function pcImport(file){const p=pcList().find(x=>x.id===PC.id);if(!p||!file)return;
 try{const id=uid();await fput(id,file);if(p.pdf&&p.pdf.id){try{await fdel(p.pdf.id)}catch(e){}}p.pdf={id,name:file.name,size:file.size};
  let txt='';try{txt=await pdfTextOf(file,4)}catch(e){}
  PC.msg=pcApply(p,pcParse(txt),txt);save();render()}catch(e){PC.msg='Import impossible : '+(e&&e.message||e);render()}}
function pcApply(p,r,txt){if(!txt)return 'PDF joint, mais le lecteur n’a pas pu l’ouvrir. Saisissez les montants à la main.';
 p.info=p.info||{};['fai','notaire','acte','surface','loyerM','tf','pno','clef','renta'].forEach(k=>{if(r[k]!=null)p.info[k]=r[k]});
 if(r.ref&&!p.ref)p.ref='Pré-chiffrage Works – '+r.ref;
 if(r.date){const m=r.date.match(/(\d{2})\/(\d{2})\/(\d{4})/);if(m)p.date=m[3]+'-'+m[2]+'-'+m[1]}
 p.lots=r.lots||[];p.travTTC=r.travTTC||null;let msg='';
 if(r.postes&&r.postes.length){p.lignes=r.postes.map(x=>({id:uid(),p:x.p,d:'',v:x.v,m:(x.tva!=null?x.ttc-x.tva:x.ttc/(1+(+String(x.v).replace(',','.')||0)/100)).toFixed(2)}));p.statut=p.statut==='Demandé'?'Reçu':p.statut;
  msg=r.postes.length+' postes importés'+(r.postesOk===false?' — ⚠️ la somme ne correspond pas au total du PDF, vérifiez':' ('+fe0(pcTot(p).ttc)+' TTC, conforme au PDF)')+'.'}
 else if(r.travTTC){p.lignes=[{id:uid(),p:'Travaux (total du PDF)',d:'',v:'10',m:(r.travTTC/1.1).toFixed(2)}];msg='Total des travaux repris ('+fe0(r.travTTC)+' TTC) ; le détail des postes n’a pas pu être lu. TVA supposée à 10 %, à corriger si besoin.'}
 else msg='Le PDF n’a pas le format attendu : saisissez les postes à la main.';
 if(r.clef)msg+=' Données du projet reprises.';return msg}

/* --- archive du dossier : ZIP et PDF unique --- */
const ARC={busy:false};
function arcName(s){return String(s||'document').replace(/[\\/:*?"<>|]+/g,'-').replace(/\s+/g,' ').trim().slice(0,70)}
function arcDocs(f){const o=[];TABS.forEach(([t,l])=>{(f.d||[]).filter(d=>catTab(d.grp||'Divers')===t).forEach(d=>o.push({d,cat:l}))});(f.d||[]).filter(d=>!TABS.some(([t])=>catTab(d.grp||'Divers')===t)).forEach(d=>o.push({d,cat:'Autres'}));return o}
async function arcBlob(d){if(d.pdf){const b=await fget(d.id);if(!b)throw new Error('fichier introuvable');return b instanceof Blob?b:new Blob([b],{type:'application/pdf'})}return await mkPdf([{t:d.t||'Document',h:d.h||''}])}
async function arcZip(f){if(ARC.busy)return;if(!window.JSZip||!window.jspdf){toast('Outils d’export non chargés. Rechargez la page.');return}
 const L=arcDocs(f);if(!L.length){toast('Aucun document dans ce dossier.');return}ARC.busy=true;const bad=[];
 try{const z=new JSZip();let n=0;for(const {d,cat} of L){n++;toast('Préparation… '+n+'/'+L.length);try{z.file(String(n).padStart(2,'0')+' - '+arcName(cat)+' - '+arcName(d.t)+'.pdf',await arcBlob(d))}catch(e){bad.push(d.t||'document')}}
  const b=await z.generateAsync({type:'blob'});await xdl('Dossier - '+arcName(f.name)+'.zip',b);toast(bad.length?'ZIP prêt. Non inclus : '+bad.join(', '):'ZIP prêt : '+(L.length-bad.length)+' documents.')}
 catch(e){toast('Export impossible.')}ARC.busy=false}
async function arcMerge(f){if(ARC.busy)return;if(!window.PDFLib||!window.jspdf){toast('Outils d’export non chargés (pdf-lib). Rechargez la page.');return}
 const L=arcDocs(f);if(!L.length){toast('Aucun document dans ce dossier.');return}ARC.busy=true;const bad=[],parts=[];
 try{const {PDFDocument}=PDFLib;let n=0;for(const {d,cat} of L){n++;toast('Assemblage… '+n+'/'+L.length);try{const b=await arcBlob(d),pd=await PDFDocument.load(await b.arrayBuffer(),{ignoreEncryption:true});parts.push({d,cat,pd,np:pd.getPageCount()})}catch(e){bad.push(d.t||'document')}}
  if(!parts.length){toast('Aucun document lisible.');ARC.busy=false;return}
  const mkSom=off=>{let p=off+1;const rows=parts.map((x,i)=>{const r=[String(i+1),x.cat,x.d.t||'Document',String(p)];p+=x.np;return r});return `<h1>Dossier : ${esc(f.name)}</h1><p>Sommaire des documents · ${esc(fDate(isoT()))}</p><table style="border-collapse:collapse;width:100%"><tbody><tr>${['N°','Rubrique','Document','Page'].map(h=>`<td><b>${h}</b></td>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`};
  let sb=await mkPdf([{t:'Sommaire',h:mkSom(1)}]),sp=await PDFDocument.load(await sb.arrayBuffer());const off=sp.getPageCount();sb=await mkPdf([{t:'Sommaire',h:mkSom(off)}]);sp=await PDFDocument.load(await sb.arrayBuffer());
  const out=await PDFDocument.create();(await out.copyPages(sp,sp.getPageIndices())).forEach(p=>out.addPage(p));
  for(const x of parts){(await out.copyPages(x.pd,x.pd.getPageIndices())).forEach(p=>out.addPage(p))}
  const bytes=await out.save();await xdl('Dossier complet - '+arcName(f.name)+'.pdf',new Blob([bytes],{type:'application/pdf'}));toast(bad.length?'PDF prêt. Non inclus : '+bad.join(', '):'PDF unique prêt : '+out.getPageCount()+' pages.')}
 catch(e){toast('Assemblage impossible.')}ARC.busy=false}

async function sgFromImage(file){const {PDFDocument}=PDFLib,d=await PDFDocument.create(),bm=await createImageBitmap(file);

 const jb=await new Promise(r=>c.toBlob(r,'image/jpeg',0.9)),im=await d.embedJpg(await jb.arrayBuffer()),w=595,h=w*bm.height/bm.width,p=d.addPage([w,h]);p.drawImage(im,{x:0,y:0,width:w,height:h});
 return (await d.save()).buffer.slice(0)}

const LIBSEED=[{"g": "Offres d’achat", "t": "Offre d’achat (modèle)", "h": "<h2 style='text-align:center'>OFFRE D’ACHAT</h2><p>Je soussigné(e) / Nous soussignés :</p><p>{{acquereur_etat}}</p><p>ci-après dénommé(s) « l’Acquéreur », déclare(nt) faire à {{vendeur}}, propriétaire(s), l’offre irrévocable d’acquérir le bien suivant :</p><p><b>Désignation du bien :</b> {{bien}}</p><p><b>Prix offert :</b> {{prix}} net vendeur, honoraires d’agence en sus à la charge de l’Acquéreur / inclus (rayer la mention inutile).</p><p><b>Financement :</b> apport personnel de … € ; solde financé par un prêt de … € sur … ans, au taux maximum de … %. L’acquisition est soumise à la condition suspensive d’obtention de ce prêt.</p><p><b>Autres conditions suspensives :</b> …</p><p><b>Date souhaitée de signature de l’avant-contrat :</b> …</p><p><b>Date souhaitée de l’acte authentique :</b> …</p><p><b>Validité de l’offre :</b> la présente offre est valable jusqu’au … à … h. Passé ce délai, elle sera caduque de plein droit.</p><p>La présente offre ne constitue pas une promesse de vente et ne devient définitive qu’après acceptation écrite du vendeur et signature d’un avant-contrat.</p><p>Fait à …, le {{date}}</p><p>Signature de l’Acquéreur (précédée de la mention « Bon pour offre d’achat ») :</p><p><br></p>"}, {"g": "Offres d’achat", "t": "Acceptation d’offre d’achat (modèle)", "h": "<h2 style='text-align:center'>ACCEPTATION D’OFFRE D’ACHAT</h2><p>Je soussigné(e) / Nous soussignés :</p><p>{{vendeur_etat}}</p><p>propriétaire(s) du bien situé : {{bien}} (mandat n° {{mandat}}),</p><p>déclare(nt) avoir pris connaissance de l’offre d’achat de {{acquereur}} en date du …, au prix de {{prix}}, et l’<b>accepter</b> sans réserve / sous les réserves suivantes : …</p><p>Cette acceptation sera suivie de la signature d’un avant-contrat chez le notaire ou en agence, au plus tard le …</p><p>Fait à …, le {{date}}</p><p>Signature du / des vendeur(s) :</p><p><br></p>"}, {"g": "Courriers vendeurs", "t": "Courrier vendeur – transmission d’une offre", "h": "<p style='text-align:right'>Le {{date}}</p><p>Objet : offre d’achat – {{bien}} (mandat n° {{mandat}})</p><p>Bonjour,</p><p>Nous avons reçu ce jour une offre d’achat de {{acquereur}} pour votre bien situé {{bien}}, au prix de {{prix}}.</p><p>Vous trouverez cette offre en pièce jointe. Elle est valable jusqu’au … . Nous vous invitons à nous faire part de votre décision (acceptation, refus ou contre-proposition) avant cette date.</p><p>Je reste à votre disposition pour en discuter par téléphone.</p><p>Cordialement,</p><p>YES Immobilier</p>"}, {"g": "Courriers vendeurs", "t": "Courrier vendeur – demande de pièces", "h": "<p style='text-align:right'>Le {{date}}</p><p>Objet : constitution du dossier de vente – {{bien}}</p><p>Bonjour,</p><p>Afin de préparer l’avant-contrat de vente de votre bien situé {{bien}}, merci de nous transmettre les pièces suivantes :</p><ul><li>pièce d’identité et justificatif d’état civil de chaque vendeur ;</li><li>titre de propriété (acte d’acquisition) ;</li><li>derniers avis de taxe foncière et relevé de charges de copropriété ;</li><li>trois derniers procès-verbaux d’assemblée générale, règlement de copropriété et état descriptif de division (si copropriété) ;</li><li>diagnostics techniques en cours de validité (DPE, amiante, plomb, électricité, gaz, état des risques…) ;</li><li>factures et garanties des travaux récents (décennale, dommages-ouvrage) ;</li><li>le cas échéant, bail en cours et dernières quittances de loyer.</li></ul><p>Merci de nous les adresser dès que possible afin de ne pas retarder la signature.</p><p>Cordialement,</p><p>YES Immobilier</p>"}, {"g": "Courriers vendeurs", "t": "Courrier vendeur – relance", "h": "<p style='text-align:right'>Le {{date}}</p><p>Objet : {{bien}} – relance</p><p>Bonjour,</p><p>Je me permets de revenir vers vous au sujet de la vente de votre bien situé {{bien}} (mandat n° {{mandat}}).</p><p>Pourriez-vous me confirmer … ? Dans l’attente de votre retour, je reste à votre disposition.</p><p>Cordialement,</p><p>YES Immobilier</p>"}, {"g": "Courriers acquéreurs", "t": "Courrier acquéreur – réception de l’offre", "h": "<p style='text-align:right'>Le {{date}}</p><p>Objet : votre offre d’achat – {{bien}}</p><p>Bonjour,</p><p>Nous accusons réception de votre offre d’achat du … relative au bien situé {{bien}}, au prix de {{prix}}. Nous la transmettons ce jour au vendeur, qui dispose jusqu’au … pour y répondre.</p><p>Nous ne manquerons pas de vous tenir informé(s) de sa décision.</p><p>Cordialement,</p><p>YES Immobilier</p>"}, {"g": "Courriers acquéreurs", "t": "Courrier acquéreur – acceptation de l’offre", "h": "<p style='text-align:right'>Le {{date}}</p><p>Objet : votre offre d’achat acceptée – {{bien}}</p><p>Bonjour,</p><p>Nous avons le plaisir de vous informer que {{vendeur}} a accepté votre offre d’achat de {{prix}} pour le bien situé {{bien}}.</p><p>Prochaine étape : la signature de l’avant-contrat. Afin de le préparer, merci de nous transmettre votre pièce d’identité, vos justificatifs d’état civil et vos justificatifs de financement.</p><p>Nous vous contacterons très prochainement pour fixer la date de signature.</p><p>Cordialement,</p><p>YES Immobilier</p>"}, {"g": "Courriers acquéreurs", "t": "Courrier acquéreur – justificatifs de financement", "h": "<p style='text-align:right'>Le {{date}}</p><p>Objet : financement de votre acquisition – {{bien}}</p><p>Bonjour,</p><p>Pour finaliser le dossier d’acquisition du bien situé {{bien}}, merci de nous communiquer :</p><ul><li>votre accord de principe ou offre de prêt bancaire ;</li><li>un justificatif de l’apport personnel (relevés de compte) ;</li><li>votre pièce d’identité et justificatif d’état civil.</li></ul><p>Ces éléments nous permettront de respecter les délais prévus.</p><p>Cordialement,</p><p>YES Immobilier</p>"}, {"g": "Courriers acquéreurs", "t": "Convocation à la signature", "h": "<p style='text-align:right'>Le {{date}}</p><p>Objet : convocation à la signature – {{bien}}</p><p>Bonjour,</p><p>Nous avons le plaisir de vous convoquer pour la signature de l’acte relatif au bien situé {{bien}}, le … à … h, en l’étude de Maître … , située … .</p><p>Merci de vous munir de votre pièce d’identité en cours de validité et, pour l’acquéreur, du moyen de paiement convenu pour les frais.</p><p>Merci de nous confirmer votre présence.</p><p>Cordialement,</p><p>YES Immobilier</p>"}, {"g": "Attestations", "t": "Bon de visite", "h": "<h2 style='text-align:center'>BON DE VISITE</h2><p>Je soussigné(e) : {{acquereur_etat}}</p><p>reconnais avoir visité, le {{date}}, avec l’agence YES Immobilier, le bien situé : {{bien}}, proposé au prix de {{prix}}.</p><p>Je m’engage à ne pas traiter directement avec le propriétaire ni avec un autre intermédiaire pour ce bien, et à passer par l’agence pour toute offre ou négociation.</p><p>Fait à …, le {{date}}</p><p>Signature :</p><p><br></p>"}, {"g": "Attestations", "t": "Attestation de remise de documents", "h": "<h2 style='text-align:center'>ATTESTATION DE REMISE DE DOCUMENTS</h2><p>Je soussigné(e) : {{acquereur_etat}}</p><p>atteste avoir reçu, le {{date}}, de l’agence YES Immobilier, les documents suivants relatifs au bien situé {{bien}} : dossier de diagnostics techniques, règlement de copropriété, procès-verbaux d’assemblées générales, … .</p><p>Fait à …, le {{date}}</p><p>Signature :</p><p><br></p>"}];
function libSeed(){const L=lib();let n=0;LIBSEED.forEach(m=>{if(L.d.some(d=>d.t===m.t))return;if(!L.lc.includes(m.g))L.lc.push(m.g);L.d.push({id:uid(),t:m.t,h:m.h,u:today(),cat:'p',grp:m.g,code:'MOD',st:'Brouillon'});n++});save();return n}
function dl(cats){
 const L=lib(),q=norm(V.dq||''),ok=d=>!q||norm(d.t+' '+(d.grp||'')).includes(q);
 const row=d=>`<div class='card click' data-a='libOpen' data-id='${d.id}'><div style='min-width:0'><div class='t'>${d.pdf?'📕 ':'📝 '}${esc(d.t)}</div><div class='m'>${esc(d.u||'')}${d.pdf?' · PDF':''}</div></div><span class='sp'></span><div class='qa'><button class='p' data-a='libUse' data-id='${d.id}' title='Copier ce modèle dans un dossier de vente'>↪ Utiliser</button><button data-a='libMenu' data-id='${d.id}' aria-label='Plus d’actions' title='Renommer, déplacer, dupliquer, supprimer…'>⋯</button></div></div>`;
 cats=cats||[...L.lc];const out=cats.map(g=>{const rs=L.d.filter(d=>(d.grp||'Divers')===g&&ok(d));if(q&&!rs.length)return '';return `<h3>${esc(g)} (${rs.length})${!L.d.some(d=>(d.grp||'Divers')===g)&&L.lc.includes(g)?` <span data-a='libDelCat' data-id="${esc(g)}" title='Supprimer cette catégorie vide' style='cursor:pointer'>✕</span>`:''}</h3>${rs.length?rs.map(row).join(''):`<p class='m' style='margin:0 0 8px'>Aucun modèle.</p>`}`}).join('');
 return out||`<p class='m'>Aucun modèle trouvé.</p>`}

function listDlg(title,sub,rows){

 const end=()=>{document.removeEventListener('keydown',kd,true);d.remove()};

function detectMandat(txt){
 const t=String(txt||'').replace(/[º˚]/g,'°').replace(/\s+/g,' ');
 const ok=v=>v&&/\d/.test(v)&&v.length<=20;
 const P=[/mandat(?:\s+(?:de\s+(?:vente|recherche|gestion|location)|exclusif|simple|semi[-\s]?exclusif|immobilier))*\s*(?:n\s*°|n°|no\.?|num[ée]ro|numero)\s*[:.]?\s*([A-Z]{0,4}[-/]?\d[\w\-/]*)/i,
  /(?:n\s*°|num[ée]ro|numero)\s*(?:de\s+|du\s+)?mandat\s*[:.]?\s*([A-Z]{0,4}[-/]?\d[\w\-/]*)/i,
  /r[ée]f(?:[ée]rence)?\.?\s*(?:du\s+)?mandat\s*[:.]?\s*([A-Z]{0,4}[-/]?\d[\w\-/]*)/i,
  /mandat\s+n\s*[:.]\s*([A-Z]{0,4}[-/]?\d[\w\-/]*)/i];
 for(const r of P){const m=t.match(r);if(m){const v=m[1].replace(/[.\-/]+$/,'');if(ok(v))return v}}return ''}

const PN=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[’‘]/g,"'").toLowerCase();
function pdfFind(items,q,vw,vh){
 q=PN(q).replace(/\s+/g,' ').trim();if(!q)return [];
 let s='';const mp=[];
 items.forEach((it,k)=>{const t=PN(it.str||'');if(!t.trim())return;if(s&&!s.endsWith(' ')&&!/^\s/.test(t)){s+=' ';mp.push(null)}
  for(let j=0;j<t.length;j++){s+=t[j];mp.push([k,j,t.length])}});
 const out=[];let i=0;
 while((i=s.indexOf(q,i))>=0){const seg={};
  for(let c=i;c<i+q.length;c++){const m=mp[c];if(!m)continue;const o=seg[m[0]]||(seg[m[0]]={a:m[1],b:m[1],n:m[2]});o.b=m[1]}
  const rects=Object.keys(seg).map(k=>{const it=items[k],o=seg[k],tr=it.transform,w=it.width||0,h=Math.abs(it.height||tr[3]||10);
   return {l:(tr[4]+w*o.a/o.n)/vw*100,t:(vh-tr[5]-h*.95)/vh*100,w:Math.max(.4,w*(o.b-o.a+1)/o.n/vw*100),h:h*1.2/vh*100}});
  out.push(rects);i+=q.length}
 return out}

const PRIV0=`<h3>Politique de gestion des données personnelles</h3>
<p>YES IMMO, agence immobilière dont l’établissement de Béthune est situé 33 place du 73ème, 62400 Béthune, attache une grande importance à la protection des données à caractère personnel qu’elle collecte et traite dans le cadre de son activité, notamment au moyen de son outil de gestion « YES CRM ».</p>
<p>La collecte et le traitement de ces données sont régis par la présente politique et respectent la loi « Informatique et libertés » du 6 janvier 1978 modifiée ainsi que le Règlement général sur la protection des données (règlement UE 2016/679, « RGPD »). YES IMMO met en œuvre des procédures internes pour sensibiliser ses collaborateurs à ces règles.</p>
<h4>Définitions</h4>
<p><b>Données personnelles</b> : toute information se rapportant à une personne physique identifiée ou identifiable. <b>Personne concernée</b> : cette personne physique. <b>Responsable du traitement</b> : celui qui détermine les finalités et les moyens du traitement. <b>Sous-traitant</b> : celui qui traite des données pour le compte du responsable. <b>Traitement</b> : toute opération sur des données (collecte, enregistrement, conservation, consultation, communication, effacement…).</p>
<p>Pour les données de ses clients (vendeurs, acquéreurs, mandants) et de ses collaborateurs utilisateurs du CRM, YES IMMO est <b>responsable du traitement</b>.</p>
<h4>1. Nos engagements</h4>
<p>YES IMMO s’engage à garantir un niveau de protection élevé des données personnelles et à respecter les principes des articles 5 et 6 du RGPD : les données sont traitées de manière licite, loyale et transparente ; collectées pour des finalités déterminées, explicites et légitimes ; limitées à ce qui est nécessaire ; exactes et tenues à jour. YES IMMO met en œuvre des mesures techniques et organisationnelles adaptées au risque et n’a recours qu’à des sous-traitants respectant le RGPD.</p>
<h4>2. Données collectées</h4>
<p>Données d’identification et de situation : civilité, nom, prénom, date et lieu de naissance, nationalité, situation matrimoniale, profession, adresse postale, adresse e-mail, numéro de téléphone. Données relatives à l’opération : adresse et description du bien, prix, documents du dossier (mandat, compromis, annexes, diagnostics, courriers, pièces justificatives). Données de connexion des utilisateurs du CRM : adresse e-mail du compte, journal des connexions et des sauvegardes.</p>
<h4>3. Moyens de collecte</h4>
<p>Les données sont communiquées à YES IMMO par les personnes concernées lors de leurs échanges avec l’agence (rendez-vous, mandat, courriers, e-mails, téléphone), par des documents qu’elles transmettent, ou saisies et importées dans le CRM par les collaborateurs habilités.</p>
<h4>4. Finalités et bases juridiques</h4>
<p><b>Exécution du contrat ou de mesures précontractuelles</b> : gestion des mandats et des dossiers de vente, préparation et suivi des compromis et actes, gestion des communications avec les clients et les partenaires (notaires, diagnostiqueurs…). <b>Obligations légales et réglementaires</b> : respect de la réglementation applicable à l’activité immobilière, réponses aux demandes des autorités habilitées, gestion des demandes d’exercice de droits. <b>Intérêt légitime</b> : sécurité et prévention des atteintes aux systèmes, gestion administrative interne, établissement de preuves nécessaires à la défense des droits de YES IMMO.</p>
<h4>5. Durées de conservation</h4>
<p>YES IMMO conserve les données pendant une durée n’excédant pas celle nécessaire aux finalités pour lesquelles elles sont traitées, augmentée du délai de prescription légale et des durées de conservation imposées par les lois applicables.</p>
<h4>6. Destinataires et transferts</h4>
<p>Les données sont accessibles au personnel habilité de YES IMMO et, selon les dossiers, aux partenaires intervenant dans l’opération (notaires, diagnostiqueurs, banques…) et aux sous-traitants listés au point 9. YES IMMO leur demande des mesures strictes de confidentialité et de sécurité, et peut être tenue de communiquer des informations aux autorités publiques habilitées.</p>
<p>Certains prestataires (notamment Google) peuvent être établis hors de l’Union européenne. YES IMMO veille alors à ce que le transfert soit encadré par des clauses contractuelles types de la Commission européenne ou tout autre mécanisme conforme au RGPD.</p>
<h4>7. Droits des personnes concernées</h4>
<p>Toute personne concernée peut exercer à tout moment ses droits d’accès, de rectification, d’effacement, de limitation, d’opposition et de portabilité. Lorsque le traitement repose sur le consentement, celui-ci peut être retiré à tout moment. Ces droits s’exercent par e-mail à contact-ard@yes-immobilier.com ou par courrier à YES IMMO, 33 place du 73ème, 62400 Béthune, en joignant les éléments nécessaires à l’identification (nom, prénom, e-mail). En cas de manquement, une réclamation peut être adressée à la CNIL (3 place de Fontenoy, TSA 80715, 75334 Paris cedex 07 ; cnil.fr), sans préjudice de tout autre recours.</p>
<h4>8. Sécurité</h4>
<p>YES IMMO met en œuvre les mesures utiles pour préserver la sécurité des données et empêcher toute destruction, perte, altération, divulgation ou accès non autorisé. Les données sont enregistrées dans le navigateur de l’appareil de l’utilisateur, avec une option de verrouillage par mot de passe et de chiffrement ; la messagerie passe par Gmail. L’accès au CRM peut être protégé par un mot de passe avec chiffrement des données sur l’appareil, et se verrouille après une période d’inactivité. En cas de violation de données, YES IMMO la notifie à la CNIL dans les 72 heures lorsque la réglementation l’exige et informe les personnes concernées si le risque pour elles est élevé.</p>
<p><b>Engagements des utilisateurs du CRM :</b> n’accéder qu’aux dossiers utiles à son travail ; garder son mot de passe secret et ne jamais partager son compte ; fermer sa session en quittant son poste, surtout sur un ordinateur partagé ; ne pas copier de données hors du CRM sans nécessité ; exporter régulièrement une sauvegarde et la conserver en lieu sûr ; signaler immédiatement toute perte, tout vol de matériel ou tout accès suspect.</p>
<h4>9. Sous-traitants de YES IMMO</h4>
<p>YES IMMO fait appel aux prestataires suivants et s’assure qu’ils présentent des garanties suffisantes au sens de l’article 28 du RGPD :</p>
<ul style="margin:0 0 8px;padding-left:20px"><li><b>Claude (Anthropic)</b> : hébergement de l’application, les données restant enregistrées dans le navigateur de l’utilisateur ;</li><li><b>Google (Gmail)</b> : messagerie, par la connexion Claude ;</li><li><b>Modelo (FNAIM)</b> : simple lien externe vers le logiciel de rédaction d’actes, sans transmission de données par le CRM.</li><li><b>Hektor (La Boîte Immo)</b> : simple lien externe vers le logiciel de gestion de l’agence, sans transmission de données par le CRM.</li></ul>
<h4>10. Liens vers d’autres sites</h4>
<p>Le CRM peut contenir des liens vers d’autres sites (par exemple Modelo). YES IMMO recommande de consulter leur politique de protection des données et n’est pas responsable des traitements qu’ils effectuent.</p>
<h4>11. Modifications</h4>
<p>YES IMMO se réserve le droit d’adapter la présente politique.</p>`;

function gmailCompose(to,su,body){
 let u='https://mail.google.com/mail/?view=cm&fs=1&to='+encodeURIComponent(to||'')+'&su='+encodeURIComponent(su||'');
 let long=false;const full=u+'&body='+encodeURIComponent(body||'');
 if(full.length<=7000)u=full;else if(body){long=true;try{navigator.clipboard&&navigator.clipboard.writeText(body)}catch(e){}}
 window.open(u,'_blank','noopener');return long}

 if(!(p.subject||'').trim()&&!(p.body||'').trim()){p.msg='Le message est vide.';p.url='';render();return}
 if(!MC){webMail(p.to.trim(),p.subject||'',p.body||'');return}
 const ok=await askSend({to:p.to.trim(),subject:(p.subject||'').trim()||'(sans objet)',reply:!!p.reply});
 if(M.comp!==p||!ok)return;
 p.busy=true;p.msg='Envoi en cours…';p.url='';render();
 try{const inp={to:[p.to.trim()],subject:p.subject||'',body:p.body||'',includeSignature:true};if(p.reply)inp.replyToMessageId=p.reply;
  await MC.callTool('Gmail','send_message',inp,{cache:false});
  const tid=M.cur&&M.cur.tid,comp=M.cur&&M.cur.compose;M.comp=null;if(comp)M.cur=null;
  toast('Message envoyé.');
  if(tid&&!comp)mailOpen(tid);else if(M.nav==='sent')mailSearch();else render();return}
 catch(e){p.msg=(e&&e.code?mailErr(e):'Impossible d’envoyer le message.')+' Rien n’a été confirmé : vérifiez le dossier « Envoyés » avant de recommencer.'}
 p.busy=false;if(V.v==='mail'&&M.comp===p)render()}

  catch(e){if(!e||e.code!=='declined')say('Impossible de préparer le fichier.')}
  return}
 if(fmt==='pdf'&&!window.jspdf||fmt==='docx'&&!window.JSZip){say('Outil d’export non chargé. Vérifiez votre connexion et rechargez la page.');return}
 const title=($('#ti').value||'').trim()||'Document';
 if(btn)btn.disabled=true;if(bs)bs.disabled=true;say(send?'Préparation du message…':'Création du brouillon…');
 try{
  const l=[{t:title,h:$('#ed').innerHTML}],blob=fmt==='pdf'?await mkPdf(l):await mkDocx(l);
  if(blob.size>18*1024*1024){say('Le document est trop volumineux pour une pièce jointe.');return}
  const fn=title.replace(/[\\/:*?"<>|]+/g,'-').slice(0,80)+'.'+fmt,mt=fmt==='pdf'?'application/pdf':'application/vnd.openxmlformats-officedocument.wordprocessingml.document';

<p>YES IMMO, agence immobilière dont l’établissement de Béthune est situé 33 place du 73ème, 62400 Béthune, attache une grande importance à la protection des données à caractère personnel qu’elle collecte et traite dans le cadre de son activité, notamment au moyen de son outil de gestion « YES CRM ».</p>

<h4>Définitions</h4>
<p><b>Données personnelles</b> : toute information se rapportant à une personne physique identifiée ou identifiable. <b>Personne concernée</b> : cette personne physique. <b>Responsable du traitement</b> : celui qui détermine les finalités et les moyens du traitement. <b>Sous-traitant</b> : celui qui traite des données pour le compte du responsable. <b>Traitement</b> : toute opération sur des données (collecte, enregistrement, conservation, consultation, communication, effacement…).</p>
<p>Pour les données de ses clients (vendeurs, acquéreurs, mandants) et de ses collaborateurs utilisateurs du CRM, YES IMMO est <b>responsable du traitement</b>.</p>

 const go=async()=>{if(!fid){er.textContent='Facteur introuvable : déconnectez-vous et réessayez.';return}er.textContent='';const r=await sb.auth.mfa.challengeAndVerify({factorId:fid,code:pw.value.replace(/\s/g,'')});if(r.error){er.textContent='Code incorrect ou expiré.';pw.select()}else proceed(user)};
 o.querySelector('#lkb').onclick=go;pw.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
 o.querySelector('#lkf').onclick=async()=>{await sb.auth.signOut();location.reload()}}
function cgu(user){
 put('<div class="m">Avant de commencer, lisez et acceptez les conditions d’utilisation.</div><div class="pv">'+window.PRIV_HTML+'</div><label style="display:flex;gap:8px;align-items:flex-start;font-size:14px"><input type="checkbox" id="lkk" style="margin-top:3px"> J’ai lu ces conditions et je m’engage à les respecter.</label><div class="e" id="lkm"></div><button id="lkb" disabled>Accepter et continuer</button><a id="lkf" style="text-align:center">Se déconnecter</a>',true);
 const ck=o.querySelector('#lkk'),bt=o.querySelector('#lkb'),er=o.querySelector('#lkm');ck.onchange=()=>{bt.disabled=!ck.checked};
 bt.onclick=async()=>{bt.disabled=true;const r=await sb.auth.updateUser({data:{cgu_v1:new Date().toISOString()}});if(r.error){er.textContent=MSG(r.error.message);bt.disabled=false;return}
  window.__CGU=true;boot(r.data.user||user,'cgu_acceptee')};
 o.querySelector('#lkf').onclick=async()=>{await sb.auth.signOut();location.reload()}}
async function proceed(user){
 try{const a=await sb.auth.mfa.getAuthenticatorAssuranceLevel(),L=a.data;if(L&&L.nextLevel==='aal2'&&L.currentLevel!=='aal2')return mfaPrompt(user)}catch(e){}
 if(!((user.user_metadata||{}).cgu_v1))return cgu(user);
 boot(user)}
async function boot(user,first){
 if(booted)return;booted=true;window.__UID=user.id;window.__EMAIL=user.email;
 window.AUDIT=(a,d)=>{try{Promise.resolve(sb.from('audit_log').insert({user_id:user.id,action:a,detail:d||null})).then(()=>{},()=>{})}catch(e){}};
 put('<div class="m">Chargement de vos dossiers…</div>');
 const K='dossiers-vente-v1:'+user.id,dirty=SSg(K+':dirty'),cache=SSg(K);
 let row=null,err=null;
 try{const r=await sb.from('crm_data').select('data,updated_at').eq('user_id',user.id).maybeSingle();if(r.error)throw r.error;row=r.data}catch(e){err=e}
 if(err&&!cache){booted=false;put('<div class="e">Impossible de charger vos données ('+(err.message||'erreur')+').</div><button id="lkb">Réessayer</button>');o.querySelector('#lkb').onclick=()=>boot(user,first);return}
 if(dirty&&cache){window.__PLAIN=null;window.__PUSH=true;window.__V=SSg(K+':v')||null}
 else{window.__PLAIN=row&&row.data?JSON.stringify(row.data):null;window.__V=row?row.updated_at:null;try{indexedDB.deleteDatabase('yescrm-'+user.id)}catch(e){}}
 o.remove();st.remove();run();window.AUDIT(first||'connexion')}
sb.auth.onAuthStateChange((ev)=>{if(ev==='PASSWORD_RECOVERY')recover()});
(async()=>{
 const r=await sb.auth.getSession();
 if(recovering||/type=recovery/.test(location.hash+location.search))return;
 if(r.data.session){
  if(window.__REM){let m={};try{m=JSON.parse(localStorage.getItem(REMK))||{}}catch(e){}
   const n=(m.n||0)+1;
   if(n>6){try{await sb.auth.signOut()}catch(e){}try{localStorage.removeItem(REMK)}catch(e){}window.__REM=false;login('','Pour votre sécurité, saisissez de nouveau votre mot de passe.');return}
   try{localStorage.setItem(REMK,JSON.stringify({n}))}catch(e){}}
  proceed(r.data.session.user)}else login()})();
})();
</script>
