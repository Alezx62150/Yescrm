<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YES CRM</title>
<style>
:root{--bg:#faf5f2;--sf:#fff;--tx:#2b1d18;--mu:#7a6259;--ac:#a4573f;--on:#fff;--ac2:#f7e8e1;--bd:#e8d5cc;--hd:#5a3328;--dn:#b42318;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1412;--sf:#241b18;--tx:#f3e8e3;--mu:#b9a49b;--ac:#e0a28b;--on:#2a140d;--ac2:#3a2923;--bd:#4a3830;--hd:#3a2118;--dn:#f97066;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1412;--sf:#241b18;--tx:#f3e8e3;--mu:#b9a49b;--ac:#e0a28b;--on:#2a140d;--ac2:#3a2923;--bd:#4a3830;--hd:#3a2118;--dn:#f97066;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1{font-size:20px;margin:0;line-height:1.25}
h3{font-size:13px;color:var(--mu);margin:16px 0 4px;font-weight:600}
#hd{background:var(--sf);border-bottom:3px solid var(--ac);display:flex;align-items:center;gap:12px;padding:6px 14px;color:var(--tx)}
#logo{height:50px;display:flex;align-items:center;cursor:pointer}
.brand{font:700 21px Georgia,"Times New Roman",serif;letter-spacing:.2em;color:var(--ac);white-space:nowrap}
@media(max-width:520px){.brand{font-size:15px;letter-spacing:.1em}}
#logo img{height:50px;display:block}
.sp{flex:1}
#q{max-width:300px;flex:1;min-width:0;background:var(--bg);border:1px solid var(--bd);color:var(--tx);padding:7px 12px}
#q::placeholder{color:var(--mu)}
.shell{display:flex;min-height:calc(100vh - 56px)}
.sb{width:54px;background:var(--hd);display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:10px;flex:none}
.sb button{background:none;border:0;color:#fff;font-size:20px;padding:8px;border-radius:8px}
.sb button:hover{background:rgba(255,255,255,.18)}
#app{flex:1;min-width:0;padding:10px 16px 24px}
@media(max-width:700px){.shell{flex-direction:column}.sb{width:auto;flex-direction:row;padding:4px 8px}#app{padding:10px 12px 24px}}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--bd);margin-bottom:12px;overflow-x:auto}
.tab{padding:8px 14px;white-space:nowrap;border-bottom:3px solid transparent;color:var(--mu);cursor:pointer}
.tab.on{border-color:var(--ac);color:var(--ac);font-weight:600}
.dg{display:grid;grid-template-columns:270px 1fr;gap:18px;align-items:start}
@media(max-width:860px){.dg{grid-template-columns:1fr}}
.tbox{background:var(--hd);color:#fff;border-radius:6px;padding:14px;font-weight:600}
.rw{display:flex;justify-content:space-between;gap:8px;padding:8px 6px;border-bottom:1px solid var(--bd);font-size:14px}
.rw[data-a]{cursor:pointer}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
button{font:inherit;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:8px;padding:7px 12px;cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:var(--on)}
button.d{color:var(--dn)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:10px 14px;margin-bottom:8px;display:flex;gap:12px}
.card.click{cursor:pointer}
.t{font-weight:600}
.m{color:var(--mu);font-size:13px}
.badge{display:inline-block;font-size:12px;color:#a4410a;background:#fdeedd;border-radius:6px;padding:2px 8px}
.badge[hidden]{display:none}
input:not([type=checkbox]),select,textarea{font:inherit;width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--sf);color:var(--tx)}
input[type=checkbox]{width:19px;height:19px;margin:0;flex:none}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
summary{cursor:pointer;color:var(--ac);font-size:14px;margin-top:14px}
.tabs2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
.tabs2 button{background:var(--ac2);border-color:transparent;font-size:13px;padding:10px 6px}
.tabs2 button.on{background:var(--ac);color:var(--on)}
.rdp{background:#fff;color:#161616;border:1px solid var(--bd);border-radius:8px;padding:28px 34px;max-width:860px;margin:0 auto 12px;overflow-wrap:anywhere;font-family:Georgia,'Times New Roman',serif;line-height:1.7;user-select:text}.rdp table{border-collapse:collapse;max-width:100%}.rdp td,.rdp th{border:1px solid #bbb;padding:4px 6px}.rdp img{max-width:100%}@media(max-width:560px){.rdp{padding:16px}}
.hg{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:560px){.hg{grid-template-columns:1fr}}.hm{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:22px 20px;text-align:left;border-radius:12px;background:var(--sf);border:1px solid var(--bd);cursor:pointer}.hm:hover{border-color:var(--ac,#e5b4a2);box-shadow:0 2px 10px rgba(0,0,0,.08)}.hm .hi{font-size:34px;line-height:1}.hm .ht{font-size:17px;font-weight:600}.hm .hs{font-size:13px;color:var(--mu)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kc{padding:9px;border-radius:6px;cursor:pointer;font-size:13px;text-align:center}
.k1{background:rgba(184,122,101,.2)}.k2{background:rgba(120,80,60,.16)}.k3{background:rgba(222,170,120,.28)}
.gh{background:var(--ac2);padding:6px 10px;font-weight:600;cursor:pointer;font-size:14px;margin-top:10px;border-radius:6px 6px 0 0}
.dr{display:flex;align-items:center;gap:10px;padding:9px 10px;border-bottom:1px solid var(--bd);cursor:pointer;background:var(--sf)}
.dr.sel{background:var(--ac2)}
.dt{flex:1;min-width:0;overflow-wrap:anywhere}
.dd{display:none}
@media(min-width:700px){.dd{display:inline}}
.cd{font-size:11px;font-weight:700;padding:2px 6px;border-radius:4px;flex:none}
.cd.p{background:#e9b8a5;color:#4a2316}.cd.a{background:#c9806a;color:#2b1208}.cd.s{background:#5a3328;color:#fff}
.stb{font-size:12px;padding:2px 8px;border-radius:6px;cursor:pointer;white-space:nowrap}
.s0{background:rgba(120,130,150,.22)}.s1{background:rgba(39,100,200,.2)}.s2{background:rgba(200,40,40,.2);color:var(--dn)}.s3{background:rgba(30,150,80,.22)}
.tb{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0}
.tb button{padding:6px 10px;min-width:40px}
#ed{background:#fff;color:#161616;border:1px solid var(--bd);border-radius:8px;min-height:55vh;padding:22px;outline:none;overflow-wrap:anywhere;font:16px/1.6 Georgia,"Times New Roman",serif}
#ed h2{font-size:19px;margin:0 0 12px}
#ed .ct{background:#e6ecf8;border-bottom:1px dashed #27407a;border-radius:3px;padding:0 2px;cursor:pointer}
#ed table{border-collapse:collapse;width:100%;margin:8px 0}
#ed td,#ed th{border:1px solid #999;padding:6px;vertical-align:top;min-width:36px}
.stk{position:sticky;top:0;z-index:20;background:var(--bg);padding:4px 0 2px;margin:0 -4px;border-bottom:1px solid var(--bd);max-height:70vh;overflow-y:auto}.stk .bar{margin:0 0 4px;padding:0 4px}.stk .tb{padding:0 4px}
.tb select{width:auto;padding:6px 8px;max-width:150px}
.tb .cl{display:inline-flex;align-items:center;gap:4px;margin:0;padding:3px 8px;border:1px solid var(--bd);border-radius:8px;background:var(--sf);color:var(--tx);font-size:14px;cursor:pointer}
.tb .cl input{width:26px;height:24px;padding:0;border:0;background:none;cursor:pointer}
.tpan input[type=number]{width:62px;padding:6px}
#ed img{max-width:100%;height:auto;cursor:pointer}
#ed img.sel{outline:3px solid #a4573f}
.gm{display:grid;grid-template-columns:190px 330px 1fr;border:1px solid var(--bd);border-radius:10px;overflow:hidden;background:var(--sf);min-height:72vh}
.gn{padding:10px;border-right:1px solid var(--bd);display:flex;flex-direction:column;gap:2px;background:var(--bg);overflow:auto;max-height:78vh}
.gn .gw{margin-bottom:8px}
.gni{text-align:left;border:0;background:none;border-radius:16px;padding:7px 12px;display:flex;justify-content:space-between;gap:6px}
.gni.on{background:var(--ac2);font-weight:600;color:var(--ac)}
.gnc{font-size:12px;color:var(--mu)}
.gnh{font-size:12px;color:var(--mu);margin:10px 12px 2px}
.gl{border-right:1px solid var(--bd);overflow:auto;max-height:78vh}
.gr1{display:flex;gap:10px;padding:10px 12px;border-bottom:1px solid var(--bd);cursor:pointer;background:var(--bg)}
.gr1.un{background:var(--sf);font-weight:600}
.gr1.sel{background:var(--ac2)}
.grb{min-width:0;flex:1}
.grt{display:flex;justify-content:space-between;gap:8px}
.grn,.grs,.grp{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp{font-weight:400}
.av{width:34px;height:34px;border-radius:50%;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:600;flex:none}
.gp{overflow:auto;max-height:78vh;min-width:0}
.gph{display:flex;gap:8px;align-items:center;padding:10px 12px}
.gback{display:none}
.gsub{font-size:19px;margin:0;font-weight:500;overflow-wrap:anywhere}
.gms{padding:0 12px 16px}
.gmc,.gmh{display:flex;gap:10px;align-items:center;cursor:pointer;padding:8px 0}
.gmc{border-top:1px solid var(--bd)}
.gmt{flex:1;min-width:0;overflow:hidden}
.gmc .gmt{white-space:nowrap;text-overflow:ellipsis}
.gmo{border-top:1px solid var(--bd);padding:4px 0 8px}
.gmb{background:var(--ac2);padding:8px 10px;border-radius:8px;margin:6px 0;font-size:13px}
.gma{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chip{border:1px solid var(--bd);border-radius:14px;padding:3px 10px;font-size:13px;background:var(--sf)}
.mf{width:100%;border:1px solid var(--bd);border-radius:8px;background:#fff;height:300px;display:block}
.gmp{white-space:pre-wrap;overflow-wrap:anywhere;padding:8px 0}
@media(max-width:1000px){.gm{display:block}.gn{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--bd);align-items:center;max-height:none}.gn .gw{margin:0}.gnh{display:none}.gni{white-space:nowrap}.gl{border-right:0;max-height:none}.gp{max-height:none}.gm.cur .gl{display:none}.gm:not(.cur) .gp{display:none}.gm.cur .gn{display:none}.gback{display:inline-block}}
#cfm{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9999}
.cfb{max-height:92vh;overflow:auto;background:var(--sf);color:var(--tx,inherit);border:1px solid var(--bd);border-radius:12px;padding:18px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:8px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.cfb h3{margin:0}.cfr{display:flex;flex-direction:column;overflow-wrap:anywhere}
.cfw{margin:4px 0;padding:8px 10px;border-radius:8px;background:var(--ac2);font-size:13px}
.qa{display:flex;gap:6px;align-items:center}.cnt{font-size:12px;font-weight:600;margin-left:4px;white-space:nowrap}.qa button{padding:5px 9px}
.pkr{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--bd);padding:10px 0}
.pka{text-decoration:none}
.cfb.big{max-width:97vw!important;width:97vw;height:94vh;max-height:94vh}.cfb.big #adpb{max-height:none!important;height:calc(94vh - 200px)}.cfb.big #adl,.cfb.big #adg,.cfb.big #adm{display:none}
#pa{display:none}
@media print{#hd,.shell{display:none!important}#pa{display:block;color:#000;font:12pt/1.6 Georgia,"Times New Roman",serif}.pg{page-break-after:always}body{background:#fff}:root{padding:0}}
</style>
</head>
<body>
<header id="hd"><div id="logo" data-a="logo" title="Cliquer pour changer le logo"></div><span class="brand">YES CRM</span><input type="file" id="lg" accept="image/*" hidden><span class="sp"></span><input id="q" type="search" placeholder="Recherche : dossier, contact, document" aria-label="Recherche"></header>
<div class="shell"><nav class="sb"><button data-a="home" title="Accueil" aria-label="Accueil">🏠</button><button data-a="dossiers" title="Dossiers de vente" aria-label="Dossiers de vente">📁</button><button data-a="docs" title="Documents" aria-label="Documents">📄</button><button data-a="contacts" title="Contacts" aria-label="Contacts">👥</button><button data-a="mail" title="Courriels (Gmail)" aria-label="Courriels">✉️</button><button data-a="settings" title="Réglages (en-tête, pied de page)" aria-label="Réglages">⚙️</button><button data-a="logo" title="Logo" aria-label="Choisir le logo">🖼️</button></nav><main id="app"></main></div>
<div id="pa"></div>

const nom=c=>c.type==='pm'?[c.forme&&c.forme!=='Autre'?c.forme:'',c.denom].filter(Boolean).join(' '):c.type==='succ'?'Succession de '+([c.civ,c.prenom,c.nom].filter(Boolean).join(' ')||'…'):[c.civ,c.prenom,c.nom].filter(Boolean).join(' ');

const C=()=>S.c.find(x=>x.id===V.cid);
const cOf=id=>S.c.find(c=>c.id===id);
const fdt=d=>String(d||'').split('-').reverse().join('/');
const subsOf=c=>(c.type==='succ'?c.heritiers:c.type==='pm'?c.gerants:null)||[];
const emailsOf=c=>[c.type==='succ'?'':c.email,...subsOf(c).map(x=>x.email)].filter(Boolean);
const deQ=q=>/^[aeiouyhéèêàâîôûœ]/i.test(q)?'d’'+q:'de '+q;
const fem=(c,q)=>c.civ==='Madame'?q.replace(/^(gérant|héritier|président|exécuteur|légataire)$/i,m=>m.toLowerCase()==='héritier'?'héritière':m.toLowerCase()==='exécuteur'?'exécutrice':m.toLowerCase()==='président'?'présidente':m+(m.slice(-1)==='e'?'':'e')):q;
function persTxt(c){const p=[[c.civ,c.prenom,c.nom].filter(Boolean).join(' ')];if(c.naiss)p.push((c.civ==='Madame'?'née':'né')+' le '+fdt(c.naiss)+(c.lieu?' à '+c.lieu:''));if(c.nat)p.push('de nationalité '+c.nat);if(c.matri)p.push(c.matri.toLowerCase());if(c.prof)p.push('profession : '+c.prof);if(c.adr)p.push('demeurant '+c.adr);return p.filter(Boolean).join(', ')}
function ctText(c,m){if(m!=='e')return nom(c)||'Contact sans nom';
 if(c.type==='pm'){const p=[nom(c)];if(c.capital)p.push('au capital de '+c.capital);if(c.adr)p.push('dont le siège est situé '+c.adr);if(c.siren)p.push('immatriculée sous le numéro SIREN '+c.siren+(c.rcs?' au RCS de '+c.rcs:''));
  const g=(c.gerants||[]).filter(x=>[x.prenom,x.nom].some(Boolean));
  if(g.length)p.push('représentée par '+joinL(g.map(x=>persTxt(x)+', '+fem(x,x.qual||'gérant')),' ; ',' ; et '));else if(c.rep)p.push('représentée par '+c.rep);
  if(c.qual)p.push('en qualité '+deQ(c.qual));return p.join(', ')}
 if(c.type==='succ'){let t='Succession de '+persTxt(c);const h=(c.heritiers||[]).filter(x=>[x.prenom,x.nom].some(Boolean));
  if(h.length)t+=', représentée par '+(h.length>1?'ses héritiers : ':'son héritier : ')+joinL(h.map(x=>persTxt(x)+', '+fem(x,x.qual||'héritier')),' ; ',' ; et ');return t}
 let t=persTxt(c);if(c.qual)t+=', en qualité '+deQ(c.qual);
 return t}

te à votre disposition.</p><p>Cordialement,</p><p>YES Immobilier</p>"}, {"g": "Courriers acquéreurs", "t": "Courrier acquéreur – réception de l’offre", "h": "<p style='text-align:right'>Le {{date}}</p><p>Objet : votre offre d’achat – {{bien}}</p><p>Bonjour,</p><p>Nous accusons réception de votre offre d’achat du … relative au bien situé {{bien}}, au prix de {{prix}}. Nous la transmettons ce jour au vendeur, qui dispose jusqu’au … pour y répondre.</p><p>Nous ne manquerons pas de vous tenir informé(s) de sa décision.</p><p>Cordialement,</p><p>YES Immobilier</p>"}, {"g": "Courriers acquéreurs", "t": "Courrier acquéreur – acceptation de l’offre", "h": "<p style='text-align:right'>Le {{date}}</p><p>Objet : votre offre d’achat acceptée – {{bien}}</p><p>Bonjour,</p><p>Nous avons le plaisir de vous informer que {{vendeur}} a accepté votre offre d’achat de {{prix}} pour le bien situé {{bien}}.</p><p>Prochaine étape : la signature de l’avant-contrat. Afin de le préparer, merci de nous transmettre votre pièce d’identité, vos justificatifs d’état civil et vos justificatifs de financement.</p><p>Nous vous contacterons très prochainement pour fixer la date de signature.</p><p>Cordialement,</p><p>YES Immobilier</p>"}, {"g": "Courriers acquéreurs", "t": "Courrier acquéreur – justificatifs de financement", "h": "<p style='text-align:right'>Le {{date}}</p><p>Objet : financement de votre acquisition – {{bien}}</p><p>Bonjour,</p><p>Pour finaliser le dossier d’acquisition du bien situé {{bien}}, merci de nous communiquer :</p><ul><li>votre accord de principe ou offre de prêt bancaire ;</li><li>un justificatif de l’apport personnel (relevés de compte) ;</li><li>votre pièce d’identité et justificatif d’état civil.</li></ul><p>Ces éléments nous permettront de respecter les délais prévus.</p><p>Cordialement,</p><p>YES Immobilier</p>"}, {"g": "Courriers acquéreurs", "t": "Convocation à la signature", "h": "<p style='text-align:right'>Le {{date}}</p><p>Objet : convocation à la signature – {{bien}}</p><p>Bonjour,</p><p>Nous avons le plaisir de vous convoquer pour la signature de l’acte relatif au bien situé {{bien}}, le … à … h, en l’étude de Maître … , située … .</p><p>Merci de vous munir de votre pièce d’identité en cours de validité et, pour l’acquéreur, du moyen de paiement convenu pour les frais.</p><p>Merci de nous confirmer votre présence.</p><p>Cordialement,</p><p>YES Immobilier</p>"}, {"g": "Attestations", "t": "Bon de visite", "h": "<h2 style='text-align:center'>BON DE VISITE</h2><p>Je soussigné(e) : {{acquereur_etat}}</p><p>reconnais avoir visité, le {{date}}, avec l’agence YES Immobilier, le bien situé : {{bien}}, proposé au prix de {{prix}}.</p><p>Je m’engage à ne pas traiter directement avec le propriétaire ni avec un autre intermédiaire pour ce bien, et à passer par l’agence pour toute offre ou négociation.</p><p>Fait à …, le {{date}}</p><p>Signature :</p><p><br></p>"}, {"g": "Attestations", "t": "Attestation de remise de documents", "h": "<h2 style='text-align:center'>ATTESTATION DE REMISE DE DOCUMENTS</h2><p>Je soussigné(e) : {{acquereur_etat}}</p><p>atteste avoir reçu, le {{date}}, de l’agence YES Immobilier, les documents suivants relatifs au bien situé {{bien}} : dossier de diagnostics techniques, règlement de copropriété, procès-verbaux d’assemblées générales, … .</p><p>Fait à …, le {{date}}</p><p>Signature :</p><p><br></p>"}];

function dl(cats){

 cats=cats||[...L.lc];const out=cats.map(g=>{const rs=L.d.filter(d=>(d.grp||'Divers')===g&&ok(d));if(q&&!rs.length)return '';return `<h3>${esc(g)} (${rs.length})${!L.d.some(d=>(d.grp||'Divers')===g)&&L.lc.includes(g)?` <span data-a='libDelCat' data-id="${esc(g)}" title='Supprimer cette catégorie vide' style='cursor:pointer'>✕</span>`:''}</h3>${rs.length?rs.map(row).join(''):`<p class='m' style='margin:0 0 8px'>Aucun modèle.</p>`}`}).join('');

  /r[ée]f(?:[ée]rence)?\.?\s*(?:du\s+)?mandat\s*[:.]?\s*([A-Z]{0,4}[-/]?\d[\w\-/]*)/i,
  /mandat\s+n\s*[:.]\s*([A-Z]{0,4}[-/]?\d[\w\-/]*)/i];
 for(const r of P){const m=t.match(r);if(m){const v=m[1].replace(/[.\-/]+$/,'');if(ok(v))return v}}return ''}
